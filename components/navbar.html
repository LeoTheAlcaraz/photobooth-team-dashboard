<header class="topbar">
  <div class="topbar__title">
    <h1 data-page-title>Photobooth-io Development Feed</h1>
    <div class="topbar__subtitle" data-page-subtitle>Internal workspace for daily updates</div>
  </div>
  <div class="topbar__actions">
    <button class="search-field" type="button" data-global-search aria-label="Open workspace search"><span aria-hidden="true">⌕</span><span class="muted">Search reports, bugs, updates...</span><span class="command-key">/</span></button>
    <button class="topbar__button" type="button" data-sidebar-toggle>☰</button>
    <button class="topbar__button" type="button" data-theme-toggle>◐</button>
    <button class="button-ghost" type="button" data-open-report-modal>New report</button>
    <button class="button-ghost" type="button" data-open-bug-modal>New bug</button>
    <button class="button-ghost" type="button" data-logout>Logout</button>
  </div>
</header>
